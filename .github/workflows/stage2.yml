name: Stage 2 - ShareGPT

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install torch transformers peft accelerate datasets huggingface_hub

      - name: Download base model
        run: python download_model.py

      - name: Find latest checkpoint
        id: find_checkpoint
        run: |
          CHECKPOINT_DIR="checkpoints/TeaX-Agent-Flash-MSAgent-ShareGPT"
          if [ -d "$CHECKPOINT_DIR" ] && [ "$(ls -A $CHECKPOINT_DIR 2>/dev/null)" ]; then
            echo "resume_arg=--resume $CHECKPOINT_DIR" >> $GITHUB_OUTPUT
            echo "Found checkpoint in $CHECKPOINT_DIR, will resume"
          else
            echo "resume_arg=" >> $GITHUB_OUTPUT
            echo "No checkpoint found, starting from scratch"
          fi

      - name: Run training
        run: |
          python train.py \
            --stage 2 \
            --base_model checkpoints/TeaX-Agent-Flash-MSAgent \
            --output_model checkpoints/TeaX-Agent-Flash-MSAgent-ShareGPT \
            --save_steps 25 \
            ${{ steps.find_checkpoint.outputs.resume_arg }}

      - name: Push checkpoints to branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add checkpoints/
          git commit -m "Stage 2: checkpoint update" && git push origin HEAD:${{ github.ref_name }} || echo "No changes to commit"