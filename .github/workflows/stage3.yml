name: Stage 3 - DeepSeek-Hermes

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install torch transformers peft accelerate datasets huggingface_hub

      - name: Merge base model from parts
        run: python split_model.py --merge base_model_parts --output .cache/model

      - name: Run training
        run: python train.py --stage 3 --base_model checkpoints/TeaX-Agent-Flash-MSAgent-ShareGPT --output_model checkpoints/TeaX-Agent-Flash-MSAgent-ShareGPT-DeepSeekHarmes

      - name: Commit and push checkpoints
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add checkpoints/
          git commit -m "Stage 3 checkpoint" && git push || echo "No changes"